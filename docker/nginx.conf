# nginx for the built site. Three concerns: send the right cache lifetime for
# each kind of file, compress text, and serve video with range requests so a
# <video> can seek and the intro's clips can be scrubbed by the browser.
#
# One `add_header` set, at server level, with the cache lifetime coming from a
# map. Not one location block per file type: an `add_header` inside a location
# REPLACES the server's headers rather than adding to them, so per-location
# Cache-Control would have silently dropped the security headers on exactly
# the paths that matter. The map keeps the decision in one place and the
# headers in one place.
#
# This file is included inside nginx's `http` context by the stock image, so
# a `map` at the top is valid here.

map $uri $cache_control {
    # Vite's hashed bundles: the name changes when the content does, so a
    # year, never revalidated.
    ~^/assets/                                    "public, max-age=31536000, immutable";
    # Unhashed media under public/ — film, audio, renovation stills, marks.
    # A day, not a year: these are replaced in place by name (the wide shot
    # is a placeholder awaiting its replacement), and a year of caching would
    # keep the old file on every returning visitor's disk.
    ~*\.(mp4|webm|mp3|jpe?g|png|webp|svg|ico)$    "public, max-age=86400";
    # The document itself, and anything else: never cached. index.html is
    # what points at the hashed bundles, so a stale copy would load an old
    # site.
    default                                       "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Efficient path for the large media files. Range requests are on by
    # default for static files, which is what <video> seeking needs.
    sendfile on;
    tcp_nopush on;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # ── Headers, once ─────────────────────────────────────────────────────
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # No CSP: the section clips are hotlinked from the Pexels CDN and a policy
    # would have to be maintained alongside media.js. Add one at the reverse
    # proxy if the site gets one.

    # ── Everything, falling back to index.html. The site is one page with
    #    its worlds opened in state, so there are no deep URLs yet; the
    #    fallback is what lets there be some later without touching this. ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
